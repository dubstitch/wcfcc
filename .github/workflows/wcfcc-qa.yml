name: WCFCC accessible portfolio archive QA
on:
  push:
    branches: [main, "repair/contrast-and-interactions", "repair/cheer-palette-football-depth", "qa/homepage-programs-and-cheer", "repair/turf-and-guided-combine"]
    paths:
      - "index.html"
      - "pages/**"
      - "css/**"
      - "js/**"
      - "qa/**"
      - ".github/workflows/wcfcc-qa.yml"
  workflow_dispatch:
concurrency:
  group: wcfcc-a11y-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser and accessibility checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install chromium webkit --with-deps
      - name: Serve archive
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wcfcc-http.log 2>&1 &
          sleep 2
      - name: Audit pages
        run: |
          BROWSER_NAME=chromium SHOW_SHOTS=1 node qa/wcfcc-qa.mjs
          BROWSER_NAME=webkit SHOW_SHOTS=1 node qa/wcfcc-qa.mjs
